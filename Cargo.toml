[workspace]
resolver = "3"
# `test-support` is unpublished and exists so that tests needing a real database can live
# beside the code they test, rather than only under `tests/`.
members = [
    "crates/dbos",
    "crates/dbos-macros",
    "crates/test-support",
    "demo-apps/dbos-rust-starter",
]

[workspace.package]
# Published placeholders occupy 0.1.1 on crates.io, so the first real release must be
# 0.1.2 or later. Nothing here is published yet.
version = "0.1.2"
edition = "2024"
# Latest stable minus two, rolling. Stable was 1.97.1 on 2026-08-05. Bump this when
# stable moves; CI is what makes it real.
rust-version = "1.95"
license = "MIT"
authors = ["DBOS, Inc."]
# `repository` is deliberately unset while dbos-inc/dbos-transact-rust is private: a
# repository link that 404s is worse than none. Set it when the repo goes public, which
# has to happen before any non-placeholder release anyway.

[workspace.dependencies]
# `dbos-macros` expands into `dbos::__private`, this workspace's own unstable surface, so the two
# are locked to one version with `=`. The pin lives here, next to `workspace.package.version`
# above, because it has to be bumped in the same edit — a release that moves the workspace version
# and leaves this behind either fails to publish `dbos` or resolves a macro naming paths that have
# moved.
dbos-macros = { path = "crates/dbos-macros", version = "=0.1.2" }
