[workspace]
resolver = "3"
# Two crates are published, `dbos` and `dbos-macros`. The `dbos-transact` name — held on
# crates.io at an 0.1.1 placeholder — stays a placeholder: `dbos` is the name users are pointed
# at everywhere. `test-support` is unpublished and exists so that tests needing a real database
# can live beside the code they test, rather than only under `tests/`. `xtask` is unpublished
# too and holds this repository's automation, reached as `cargo xtask`.
members = [
    "crates/dbos",
    "crates/dbos-macros",
    "crates/test-support",
    "demo-apps/dbos-rust-starter",
    "demo-apps/dbos-rust-widget-store",
    "xtask",
]

[workspace.package]
# `main` always carries the *next* release with a `-dev` suffix, so a git dependency on `main`
# reads as unreleased and a stray `cargo publish` from here would fail the `=` pin below rather
# than ship a release-numbered build. `cargo release` (see `release.toml`) strips the suffix,
# tags, publishes, and re-appends it — never edit these by hand for a release.
version = "0.5.0"
edition = "2024"
# Latest stable minus two, rolling. Stable was 1.97.1 on 2026-08-05. Bump this when
# stable moves; CI is what makes it real.
rust-version = "1.95"
license = "MIT"
authors = ["DBOS, Inc."]
repository = "https://github.com/dbos-inc/dbos-transact-rust"
homepage = "https://dbos.dev"
documentation = "https://docs.dbos.dev"
keywords = ["durable-execution", "workflow", "postgres", "orchestration", "queue"]
categories = ["asynchronous", "database"]

[workspace.dependencies]
# `dbos-macros` expands into `dbos::__private`, this workspace's own unstable surface, so the two
# are locked to one version with `=`. The pin lives here, next to `workspace.package.version`
# above, because it has to be bumped in the same edit — a release that moves the workspace version
# and leaves this behind either fails to publish `dbos` or resolves a macro naming paths that have
# moved.
dbos-macros = { path = "crates/dbos-macros", version = "=0.5.0" }
