[package]
name = "dbos"
description = "Lightweight durable workflows on Postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["engine"]
# Gates the durable execution engine: registry, contexts, workflows, steps, queues,
# scheduler, messaging, and the client. With it off, what remains is the system database
# and Conductor layers — the surface a future FFI host would consume. Nothing is behind
# it yet, but it exists now so `cargo check --no-default-features` is a standing CI gate
# rather than something switched on once the boundary is already blurred.
engine = []
# A `macros` feature (implying `engine`) arrives with the `dbos-macros` crate. Adding a
# feature is not a breaking change, so it waits until it re-exports something.

[dependencies]
# The system database layer talks to PostgreSQL directly. `AssertSqlSafe` in 0.9 means any
# runtime-built SQL — every rendered migration — must be explicitly vouched for.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
# Facade only: this crate emits spans and events and installs no subscriber.
tracing = "0.1"
# `async fn` in traits is stable but not dyn-compatible, and `SystemDatabase` has to be a
# trait object so a second backend can be dropped in without the callers changing.
async-trait = "0.1"
# Owner identities for the single-execution guard, and workflow ids.
uuid = { version = "1", features = ["v4"] }
# Columns whose shape this layer owns rather than passes through: `authenticated_roles` is always
# a JSON array of strings, unlike `input`/`output`/`error`, which are opaque caller-encoded
# payloads. PLAN.md §4.6 already commits to this crate for `rust_serde`.
serde_json = "1"
# Derives only, for the payloads this layer puts in a step's `output` column. Nothing here is a
# wire format — a step is replayed by the SDK that wrote it — so the derived shape is ours to
# choose, and choosing it by hand for each type was the alternative.
serde = { version = "1", features = ["derive"] }
# `time` only, for backoff between retries.
tokio = { version = "1", features = ["time"] }
# `workflow_schedules.last_fired_at` is ISO-8601 text rather than the epoch milliseconds every
# other time column holds, so one column needs a calendar. `std` has none — `SystemTime` and
# `Duration` and nothing else — and the alternative was hand-written civil-date arithmetic to
# honour a rule written before any column needed one. Parsing and formatting only: no timezone
# database, since the column is always UTC.
time = { version = "0.3", default-features = false, features = [
    "parsing",
    "formatting",
] }

[dev-dependencies]
# Tests need a real database, and testcontainers is the only way they get one: no environment
# variable points the suite at a long-lived server, so a green `cargo test` means the same
# thing on a laptop as in CI. The harness is its own crate so that `#[cfg(test)]` code in
# `src/` can reach it too — a module under `tests/` is visible only to the other integration
# test binaries, which would force anything it tests to be public.
dbos-test-support = { path = "../test-support" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
