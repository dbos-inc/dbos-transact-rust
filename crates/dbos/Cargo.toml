[package]
name = "dbos"
description = "Lightweight durable workflows on Postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# crates.io only auto-detects a README in the package directory; the workspace one is the crate's.
readme = "../../README.md"

[features]
default = ["engine", "macros"]
# Gates the durable execution engine: the lifecycle, registry, contexts, workflows, steps,
# events, recovery, queues and the client so far, with the scheduler and messaging to come.
# With it off, what remains is the system database and Conductor layers — the surface a future
# FFI host would consume. `cargo check --no-default-features` is a standing CI gate, so the
# boundary is checked continuously rather than rediscovered once it has already blurred.
#
# `tokio/rt` is enabled from here rather than from the dependency itself, which is what keeps
# the gate meaningful: the runtime — `task_local!`, `JoinSet`, `Handle`, `spawn` — is the
# engine's, and a core-only build has no business pulling one in.
# `macros` joins `rt` for the same reason: the step supervisor races a body against its timeout
# with `tokio::select!`, and that is engine code. Without it here the lib only compiled because
# dev-dependencies happened to turn the feature on for the test build — which `cargo doc` and
# `--no-default-features` both see through.
engine = ["tokio/rt", "tokio/macros"]
# Re-exports `select_step!` from `dbos-macros`. Implies `engine`, because the expansion is engine
# code — it names the race's checkpoint through `dbos::__private`.
#
# **Default-on**, which is a decision about what a durable race is: not an advanced corner of the
# API but the only sound way to race inside a workflow body, and a macro nobody enabled is a trap
# rather than a feature — the mistake it exists to prevent is the one a caller reaches for when it
# is missing. What it costs is `syn` and `quote` at build time, in a crate the compiler loads and
# links into nothing, and a build that would rather not pay it can turn the feature off.
macros = ["engine", "dep:dbos-macros"]

[dependencies]
# `select_step!`, behind the `macros` feature. The `=` version lock lives in the workspace
# manifest, beside the version it locks to, so that a bump cannot move one without the other.
dbos-macros = { workspace = true, optional = true }
# The system database layer talks to PostgreSQL directly. `AssertSqlSafe` in 0.9 means any
# runtime-built SQL — every rendered migration — must be explicitly vouched for.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
# Facade only: this crate emits spans and events and installs no subscriber.
tracing = "0.1"
# `async fn` in traits is stable but not dyn-compatible, and `SystemDatabase` has to be a
# trait object so a second backend can be dropped in without the callers changing.
async-trait = "0.1"
# `CancellationToken` alone: the step supervisor needs a signal a body can observe from work the
# runtime cannot interrupt by dropping a future — a `spawn_blocking` thread, or a client holding
# its own cancel handle. Already in the tree as a transitive dependency of `sqlx`, so this adds a
# name to the manifest and no crate to the build. PLAN.md §4.5 already reaches for the same crate's
# `TaskTracker` at shutdown.
tokio-util = { version = "0.7", default-features = false }
# Owner identities for the single-execution guard, and workflow ids.
uuid = { version = "1", features = ["v4"] }
# Columns whose shape this layer owns rather than passes through: `authenticated_roles` is always
# a JSON array of strings, unlike `input`/`output`/`error`, which are opaque caller-encoded
# payloads. PLAN.md §4.6 already commits to this crate for `rust_serde`.
serde_json = "1"
# Derives only, for the payloads this layer puts in a step's `output` column. Nothing here is a
# wire format — a step is replayed by the SDK that wrote it — so the derived shape is ours to
# choose, and choosing it by hand for each type was the alternative.
serde = { version = "1", features = ["derive"] }
# `time` for backoff between retries; `sync` for the semaphore capping concurrent polling reads.
# `rt` arrives with the `engine` feature rather than here.
tokio = { version = "1", features = ["time", "sync"] }
# The error channel. `thiserror` rather than a hand-written `Display`/`Error` pair because an
# application is expected to hold a `dbos::Error` inside its own error enum, which is the derive's
# `#[from]`/`#[error(transparent)]` idiom on both sides of the boundary.
thiserror = "2"
# `workflow_schedules.last_fired_at` is ISO-8601 text rather than the epoch milliseconds every
# other time column holds, so one column needs a calendar. `std` has none — `SystemTime` and
# `Duration` and nothing else — and the alternative was hand-written civil-date arithmetic to
# honour a rule written before any column needed one. Parsing and formatting only: no timezone
# database, since the column is always UTC.
time = { version = "0.3", default-features = false, features = [
    "parsing",
    "formatting",
] }

[dev-dependencies]
# Tests define application error types to check that a workflow's *own* failures round-trip, which
# is the case that matters; the crate already depends on `thiserror` for its own error channel.
thiserror = "2"
# Tests need a real database, and testcontainers is the only way they get one: no environment
# variable points the suite at a long-lived server, so a green `cargo test` means the same
# thing on a laptop as in CI. The harness is its own crate so that `#[cfg(test)]` code in
# `src/` can reach it too — a module under `tests/` is visible only to the other integration
# test binaries, which would force anything it tests to be public.
dbos-test-support = { path = "../test-support" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
