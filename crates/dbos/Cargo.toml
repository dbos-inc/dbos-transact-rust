[package]
name = "dbos"
description = "Lightweight durable workflows on Postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# crates.io only auto-detects a README in the package directory; the workspace one is the crate's.
readme = "../../README.md"

[features]
default = ["engine", "macros", "runtime-tokio"]
# Gates the durable execution engine: the lifecycle, registry, contexts, workflows, steps,
# events, messaging, recovery, queues and the client. With it off, what remains is the system
# database layer — the surface a future FFI host would consume. `cargo check
# --no-default-features --features runtime-tokio` is a standing CI gate, so the boundary is
# checked continuously.
#
# `tokio/rt` and `tokio/macros` are enabled from here rather than from the dependency itself,
# which is what keeps the gate meaningful: `task_local!`, which `tokio/rt` gates though it needs
# no scheduler, and the `tokio::select!` the step supervisor races a body against its timeout with
# are the engine's, and a core-only build has no business pulling them in.
engine = ["tokio/rt", "tokio/macros", "dep:croner", "dep:jiff", "dep:erased-serde"]
# Re-exports `select_step!` from `dbos-macros`. Implies `engine`, because the expansion is engine
# code — it names the race's checkpoint through `dbos::__private`.
#
# **Default-on**, because the durable race is the only sound way to race inside a workflow body,
# and a macro nobody enabled is exactly the trap it exists to prevent. What it costs is `syn` and
# `quote` at build time; a build that would rather not pay that can turn the feature off.
macros = ["engine", "dep:dbos-macros"]
# The async runtime this crate spawns tasks and sets timers on, and the one `sqlx` drives its
# connections with. At least one is required; see `rt` for how several are chosen between.
#
# Only spawning and timers depend on it. `tokio` stays a dependency whatever is chosen, for its
# `sync` primitives and macros, which run on any executor.
runtime-tokio = ["sqlx/runtime-tokio", "tokio/rt", "tokio/time"]
runtime-smol = ["sqlx/runtime-smol", "dep:smol", "dep:async-io"]
# A global executor over `async-executor`, like smol's own, and the one async-std ran on.
# `async-io` supplies the timers.
runtime-async-global-executor = [
    "sqlx/runtime-async-global-executor",
    "dep:async-global-executor",
    "dep:async-io",
]

[dependencies]
# `select_step!`, behind the `macros` feature. The `=` version lock lives in the workspace
# manifest, beside the version it locks to, so that a bump cannot move one without the other.
dbos-macros = { workspace = true, optional = true }
# The system database layer talks to PostgreSQL directly. `AssertSqlSafe` in 0.9 means any
# runtime-built SQL — every rendered migration — must be explicitly vouched for.
# The runtime is not named here: each `runtime-*` feature of this crate enables `sqlx`'s own.
sqlx = { version = "0.9", default-features = false, features = ["tls-rustls", "postgres"] }
# Facade only: this crate emits spans and events and installs no subscriber.
tracing = "0.1"
# `async fn` in traits is stable but not dyn-compatible, and `SystemDatabase` has to be a
# trait object so a second backend can be dropped in without the callers changing.
async-trait = "0.1"
# `CancellationToken` alone: the step supervisor needs a signal a body can observe from work the
# runtime cannot interrupt by dropping a future — a `spawn_blocking` thread, or a client holding
# its own cancel handle. Already in the tree as a transitive dependency of `sqlx`, so this adds a
# name to the manifest and no crate to the build.
tokio-util = { version = "0.7", default-features = false }
# Owner identities for the single-execution guard, and workflow ids.
uuid = { version = "1", features = ["v4"] }
# Columns whose shape this layer owns rather than passes through: `authenticated_roles` is always
# a JSON array of strings, unlike `input`/`output`/`error`, which are opaque caller-encoded
# payloads. `raw_value` for the portable envelopes, whose arguments and error data are read as the
# exact text written rather than through a `Value`, which would round an integer past 64 bits.
serde_json = { version = "1", features = ["raw_value"] }
# Derives only, for the payloads this layer puts in a step's `output` column. Nothing here is a
# wire format — a step is replayed by the SDK that wrote it — so the derived shape is ours to
# choose.
serde = { version = "1", features = ["derive"] }
# `sync` for the semaphore capping concurrent polling reads, and the primitives `rt` builds a
# task handle from. `rt` arrives with the `engine` feature, for `task_local!`, and `time` with
# `runtime-tokio`: a build on another runtime leaves it out, so a stray `tokio::time` call fails to
# compile there rather than panicking at run time.
tokio = { version = "1", features = ["sync"] }
# The error channel. `thiserror` rather than a hand-written `Display`/`Error` pair because an
# application is expected to hold a `dbos::Error` inside its own error enum, which is the derive's
# `#[from]`/`#[error(transparent)]` idiom on both sides of the boundary.
thiserror = "2"
# `workflow_schedules.last_fired_at` is ISO-8601 text rather than the epoch milliseconds every
# other time column holds, so one column needs a calendar, and `std` has none. Parsing and
# formatting only: no timezone database, since the column is always UTC.
time = { version = "0.3", default-features = false, features = [
    "parsing",
    "formatting",
] }

# The scheduler's cron dialect: five or six fields, `L`, `W`, `#`, `?` and the `@` nicknames. The
# `jiff` backend because a schedule names an IANA timezone and fires on that zone's wall clock,
# which `time` cannot do without a timezone database. Engine-only: the system database layer
# stores `workflow_schedules.cron` uninterpreted.
croner = { version = "4.0.1", default-features = false, features = ["jiff"], optional = true }
# The timezone database behind `cron_timezone`, and the calendar the scheduler walks in it.
jiff = { version = "0.2", optional = true }
# A `CustomSerializer` is a trait object, and `serde`'s traits are not object-safe: this is what
# lets an application's serializer see each value's real type, without the engine monomorphizing
# its code. Engine-only, like the serializer it serves; never named in this crate's public API.
erased-serde = { version = "0.4", default-features = false, features = ["std"], optional = true }
# The non-tokio runtimes, each behind its `runtime-*` feature, at the versions `sqlx` asks for on
# them so that the build carries one copy of each.
smol = { version = "2", default-features = false, optional = true }
async-global-executor = { version = "3.1", default-features = false, features = [
    "async-io",
], optional = true }
async-io = { version = "2.4", optional = true }

[dev-dependencies]
# A format that is not human-readable, which serde types such as `Ipv4Addr` serialize differently
# in: what tests a custom serializer against a binary format, as an application's MessagePack one
# would be.
rmp-serde = "1"
# Tests define application error types to check that a workflow's *own* failures round-trip, which
# is the case that matters; the crate already depends on `thiserror` for its own error channel.
thiserror = "2"
# Tests need a real database, and testcontainers is the only way they get one: no environment
# variable points the suite at a long-lived server, so a green `cargo test` means the same
# thing on a laptop as in CI. The harness is its own crate so that `#[cfg(test)]` code in
# `src/` can reach it too — a module under `tests/` is visible only to the other integration
# test binaries, which would force anything it tests to be public.
dbos-test-support = { path = "../test-support" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints.clippy]
# Denied instead where it applies: for the library in `src/lib.rs`, and in each integration test
# binary that uses `#[dbos_test_support::test]`, which also runs off tokio, where a direct tokio
# call panics. The other test binaries run on tokio only and may call it.
disallowed_methods = "allow"
disallowed_types = "allow"
