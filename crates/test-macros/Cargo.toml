[package]
name = "dbos-test-macros"
description = "The test attribute of the DBOS test suite. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = [
    "full",
    "parsing",
    "printing",
    "proc-macro",
] }
