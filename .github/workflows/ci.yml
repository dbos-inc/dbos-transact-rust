name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not only where a lint flag is passed.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled, but pushes to main always finish. A run that
  # never completes leaves no record of which commit broke something, and on main that is the
  # record you actually want when a merge turns the suite red.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Third-party actions are pinned by tag here for readability. Pin them by commit SHA
# before this repository goes public.
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    # Keep in step with `rust-version` in the workspace manifest: latest stable minus two.
    # This job is the only thing that makes that number true.
    env:
      # Overrides rust-toolchain.toml, which tracks stable on purpose.
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # Catches broken intra-doc links, which are how documentation goes stale without anyone
    # noticing: a renamed type leaves every `[`OldName`]` reference pointing at nothing, and
    # nothing else in the build complains.
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  core-only:
    name: Core-only build
    runs-on: ubuntu-latest
    # The library must compile with the engine feature off. This is the boundary between
    # the system database / Conductor layers and everything built on top of them, and a
    # compile failure here is the only thing that catches a stray dependency across it.
    #
    # `-p dbos` because the check is about one crate: run over the workspace, any member
    # asking for `dbos`'s defaults would unify `engine` back on and the gate would pass
    # whatever happened. `dbos-test-support` declines them for the same reason.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p dbos --no-default-features

  test:
    name: Test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    # Both legs run in well under ten minutes, so this is a hang guard rather than a budget.
    # Without it a single stuck test burns GitHub's six-hour default before saying anything:
    # `with_retry` has no attempt limit by design, so any error it classes as transient or
    # connection-related retries forever, and a test that trips one waits out the job.
    timeout-minutes: 25
    # Both v1 backends are required, not advisory. The Cockroach leg has already caught
    # two integer-width divergences that no amount of reading the SQL would have surfaced.
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            cockroach: "false"
          - backend: cockroach
            cockroach: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        env:
          DBOS_TEST_USE_COCKROACH_DB: ${{ matrix.cockroach }}
          DBOS_TEST_TIMINGS: ${{ github.workspace }}/harness-timings.jsonl
          RUNNER_TEST_LOG: ${{ github.workspace }}/test-output.log
        # Teed rather than piped away, so the run survives as a file and can be uploaded
        # below. `shell: bash` is what makes that safe — GitHub runs it with `-eo pipefail`,
        # so a failing `cargo test` still fails the step instead of being masked by `tee`'s
        # exit code. `set -o pipefail` again below because that guarantee is worth stating
        # where it is relied on rather than looked up.
        #
        # `--no-fail-fast` because each test file is its own binary and the first to fail
        # aborts the rest: in #15 a failure in `children` hid an identical one in `events`
        # and left nine binaries unrun.
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --no-fail-fast 2>&1 | tee "$RUNNER_TEST_LOG"
      - name: Upload the ${{ matrix.backend }} test run
        uses: actions/upload-artifact@v7
        # Both raw files, kept as data rather than rendered into the job summary. Neither is
        # much use inside the run itself: what they answer is asked afterwards, and usually of
        # more than one run at a time.
        #
        # `test-output.log` is cargo's own output — a failure whose panic needs the lines around
        # it is answered from here rather than by re-running the suite, and unlike the log in the
        # web UI it can be downloaded, grepped, and diffed against last week's.
        #
        # `harness-timings.jsonl` is what the suite spent before running anything, per test
        # binary, written by the harness itself because it is the only thing that can see it.
        # The costs split two ways and want opposite fixes: starting a server and migrating its
        # baseline are paid once per binary however many tests it holds, while building and
        # resetting databases scale with the tests. Reading that split off total suite time is
        # guesswork, and guessing it wrong is how an afternoon goes into the wrong half.
        #
        # `always()`, because a red run is the one worth keeping — a suite that failed slowly
        # and one that failed fast are different problems.
        if: always()
        with:
          name: test-run-${{ matrix.backend }}
          path: |
            ${{ github.workspace }}/test-output.log
            ${{ github.workspace }}/harness-timings.jsonl
          if-no-files-found: warn

      - name: No containers left behind
        # The harness shares one container by reference count and removes it when the last
        # test drops it. A leak here is silent locally and would accumulate a container per
        # CI run, so it is asserted rather than assumed. The label is applied by the
        # harness itself — testcontainers-rs stamps `org.testcontainers.managed-by` but
        # nothing that identifies these containers as ours.
        run: |
          filter='label=dev.dbos.test-harness=true'
          remaining=$(docker ps -aq --filter "$filter" | wc -l)
          if [ "$remaining" -ne 0 ]; then
            echo "::error::$remaining test container(s) left behind by the suite"
            docker ps -a --filter "$filter"
            exit 1
          fi
